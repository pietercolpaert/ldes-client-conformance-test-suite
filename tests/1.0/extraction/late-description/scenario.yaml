{
  "version": 0,
  "entrypoint": "/root",
  "routes": [
    {
      "path": "/root",
      "requests": [
        {
          "response": {
            "status": 200,
            "headers": {
              "content-type": "application/trig"
            },
            "body": "responses/root.trig",
            "chunks": [
              {
                "body": "responses/tail.trig",
                "delayMs": 150
              }
            ]
          }
        }
      ]
    }
  ]
}
