version: 0
entrypoint: /root
routes:
  - path: /root
    requests:
      - response: { status: 408 }
      - response: { status: 425 }
      - response: { status: 429 }
      - response: { status: 500 }
      - response: { status: 502 }
      - response: { status: 503 }
      - response: { status: 504 }
      - response:
          status: 200
          headers:
            content-type: text/turtle
          body: responses/root.ttl
