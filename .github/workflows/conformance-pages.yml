name: LDES client conformance reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # The suite itself must be green before any production-client result is
  # published: typecheck, harness regression tests, fixture validation
  # (including datasets nested in oneOf alternatives), and the reference run,
  # which also enforces the requirement-coverage gate.
  suite:
    name: Suite regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the conformance suite
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, harness tests, fixture validation, reference run
        run: npm test

      - name: Upload reference report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-reference
          path: reports/reference
          if-no-files-found: error

  # Each client is always tested at the head of its default branch. The
  # report is cached under (adapter, client head, suite commit): the client is
  # only built and tested again when its default branch moved or this suite
  # changed. Otherwise the cached report is republished unchanged.
  conformance:
    name: Test ${{ matrix.adapter }}
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: rdf-connect
            repository: rdf-connect/ldes-client
            path: rdf-connect
          - adapter: openldes-ldi
            repository: OpenLDES/Linked-Data-Interactions
            path: openldes
          - adapter: europeana
            repository: europeana/rd-ldes-client
            path: europeana
    steps:
      - name: Check out the conformance suite
        uses: actions/checkout@v4

      - name: Resolve the latest client revision
        id: client
        run: |
          sha="$(git ls-remote "https://github.com/${{ matrix.repository }}.git" HEAD | cut -f1)"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "${{ matrix.repository }} default branch head: $sha"

      - name: Restore the report for this client revision
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: reports/${{ matrix.adapter }}
          key: conformance-${{ matrix.adapter }}-${{ steps.client.outputs.sha }}-${{ github.sha }}

      - name: Set up Node.js
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run build
          node dist/cli.js validate --tests tests

      - name: Check out ${{ matrix.repository }}
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ steps.client.outputs.sha }}
          path: .clients/${{ matrix.path }}

      - name: Build rdf-connect/ldes-client
        if: steps.cache.outputs.cache-hit != 'true' && matrix.adapter == 'rdf-connect'
        continue-on-error: true
        working-directory: .clients/rdf-connect
        run: |
          # Keep the conformance job running if upstream has a broken lockfile
          # or build, so the adapter can report cantTell instead.
          npm install
          npm run build

      - name: Set up Java and Maven
        if: steps.cache.outputs.cache-hit != 'true' && (matrix.adapter == 'openldes-ldi' || matrix.adapter == 'europeana')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the OpenLDES adapter host
        if: steps.cache.outputs.cache-hit != 'true' && matrix.adapter == 'openldes-ldi'
        continue-on-error: true
        run: adapters/openldes-ldi/build.sh

      - name: Build the Europeana adapter host
        if: steps.cache.outputs.cache-hit != 'true' && matrix.adapter == 'europeana'
        continue-on-error: true
        run: adapters/europeana/build.sh

      - name: Run conformance tests
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          LDES_CT_RDF_CONNECT_ROOT: ${{ github.workspace }}/.clients/rdf-connect
          LDES_CT_OPENLDES_ROOT: ${{ github.workspace }}/.clients/openldes
          LDES_CT_EUROPEANA_ROOT: ${{ github.workspace }}/.clients/europeana
        run: >-
          node dist/cli.js run
          --adapter "${{ matrix.adapter }}"
          --tests tests
          --out "reports/${{ matrix.adapter }}"
          --no-fail

      - name: Cache the report for this client revision
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: reports/${{ matrix.adapter }}
          key: conformance-${{ matrix.adapter }}-${{ steps.client.outputs.sha }}-${{ github.sha }}

      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.adapter }}
          path: reports/${{ matrix.adapter }}
          if-no-files-found: error

  pages:
    name: Publish conformance report
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the conformance suite
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build the report generator
        run: |
          npm ci
          npm run build

      - name: Download client reports
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          path: reports

      - name: Generate the LDES report site
        run: node dist/cli.js site --reports reports --out site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
